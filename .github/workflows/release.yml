name: release

# Builds the Linux installers and attaches them to a draft GitHub release. macOS and Windows are
# left out until they are tested (issue #1); add `macos-latest` (args: --target universal-apple-darwin)
# and `windows-latest` back to the matrix when they are.
# Run it by pushing a tag (git tag v0.1.0 && git push --tags) or from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Stickit v__VERSION__
          releaseBody: Linux only. macOS and Windows builds are untested and not published (see issue #1).
          releaseDraft: true
          args: ${{ matrix.args }}
